[package]
name = "http-stack-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
[dependencies]
hyper = { version = "=1.7.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "=0.1.17", default-features = false, features = ["tokio"] }
tokio = { version = "=1.44.2", features = ["net", "rt", "macros", "io-util", "sync", "time"] }
http-body-util = "=0.1.3"
bytes = "=1.11.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.118"
base64 = "=0.22.1"
