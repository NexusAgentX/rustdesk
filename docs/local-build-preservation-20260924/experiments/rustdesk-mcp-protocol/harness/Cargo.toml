[package]
name="rustdesk-mcp-protocol-tests"
version="0.1.0"
edition="2021"
rust-version="1.75"
[features]
default=["mcp"]
mcp=[]
[dependencies]
hyper={version="=1.7.0",default-features=false,features=["server","http1"]}
hyper-util={version="=0.1.17",default-features=false,features=["tokio"]}
http-body-util="=0.1.3"
tokio={version="=1.44.2",features=["net","rt","macros","io-util","sync","time"]}
tokio-util={version="=0.7.15",features=["rt"]}
bytes="=1.11.1"
serde={version="=1.0.228",features=["derive"]}
serde_json="=1.0.118"
base64="=0.22.1"
sha2="=0.10.8"
subtle="=2.6.1"
uuid={version="=1.16.0",features=["v4"]}
tracing="0.1"
